<main class="main">
    <app-header />

    <div class="grid grid-cols-1 md:grid-cols-2 main-content gap-4">
        <div class="content order-2 md:order-1 flex flex-col gap-4 pt-4 md:p-6 lg:p-12">

            <h1>
                {{APP_NAME}}
            </h1>

            <p class="description">
                Begin your path to enlightenment with the {{APP_NAME}}. Embrace spirituality in the palm of
                your hand.
            </p>

            <div class="flex gap-4 download">
                <a [href]="ROUTE.DOWNLOAD">
                    <img class="scale" width="183.35" height="54.4" alt="Apple App Store"
                        ngSrc="images/apple-store-light.svg">
                </a>
                <a [href]="ROUTE.DOWNLOAD"><img class="scale" width="183.35" height="54.4" alt="Google Play Store"
                        ngSrc="images/google-store-light.svg">
                </a>
            </div>


        </div>

        <div class="flex justify-center order-1 md:order-2">

            <div class="outside-border" >

                <img
                    *ngFor="let item of imageUrls"
                    #slideImage
                    [src]="item"
                    alt=""
                    class="background">

                <div class="silencer"></div>
                <div class="volume-up"></div>
                <div class="volume-down"></div>
                <div class="button-on"></div>
                <div class="inside-border">

                    <!-- Camera -->
                    <div class="camera">
                        <div class="camera-dot">
                            <div class="camera-dot-2"></div>
                            <div class="camera-dot-3"></div>
                        </div>
                        <div class="camera-speaker">
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

</main>
<app-user-reviews />
<app-footer [appName]="APP_NAME" />
